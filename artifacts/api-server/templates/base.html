<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Razoreye monitors competitors' llms.txt files and shows exactly what changed.">
    <title>{% block title %}Razoreye{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2311120f'/%3E%3Cellipse cx='32' cy='32' rx='15' ry='7' fill='none' stroke='%23d7ff42' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23d7ff42'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="{{ url_for('dashboard') }}">
          <span class="brand-mark"><span></span></span>
          <span>RAZOR<span>EYE</span></span>
        </a>
        <div class="system-status"><span class="pulse"></span> MONITORING ACTIVE</div>
      </header>
      <main>{% block content %}{% endblock %}</main>
      <footer>
        <span>RAZOREYE / COMPETITIVE INTELLIGENCE</span>
        <span>LLMS.TXT CHANGE MONITOR</span>
      </footer>
    </div>
    <div class="toast-stack">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="toast {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
